# ═══════════════════════════════════════════════════════════
#  HeyMate — CI/CD Pipeline (GitHub Actions)
#
#  Triggers:
#    - Push to main          → deploy to production
#    - Push to staging       → deploy to staging
#    - Pull request to main  → build & test only (no deploy)
#
#  Required GitHub Secrets:
#    RAILWAY_TOKEN        — Railway API token (from railway.app → Account → Tokens)
#    RAILWAY_PROJECT_ID   — Railway project ID
#    RAILWAY_SERVICE_ID   — Railway service ID (optional, for targeted deploys)
# ═══════════════════════════════════════════════════════════

name: HeyMate CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────
  #  Job 1: Build & Test
  # ────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Run tests if a test script exists
      - name: Run tests
        run: |
          if npm run test --if-present 2>/dev/null; then
            echo "Tests passed"
          else
            echo "No test script found, skipping"
          fi

      # Build the Expo web export
      - name: Build Expo web
        run: npx expo export --platform web --output-dir dist

      # Upload build artifacts for the deploy job
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: heymate-dist
          path: dist/
          retention-days: 3

  # ────────────────────────────────────────────────────────
  #  Job 2: Deploy to Railway
  #  Only runs on push to main or staging (not on PRs)
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://heymateapp-production.up.railway.app' || 'https://heymateapp-staging.up.railway.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: heymate-dist
          path: dist/

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying to ${{ github.ref_name == 'main' && 'production' || 'staging' }}..."
          railway up --detach
          echo "Deployment triggered successfully"

      # Optional: Wait for deployment and verify health
      - name: Verify deployment health
        if: github.ref_name == 'main'
        run: |
          echo "Waiting 60s for deployment to stabilize..."
          sleep 60
          HEALTH_URL="https://heymateapp-production.up.railway.app/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Health check returned HTTP $HTTP_STATUS — verify manually"
          fi

  # ────────────────────────────────────────────────────────
  #  Job 3: Notify on failure (optional)
  # ────────────────────────────────────────────────────────
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Post failure summary
        run: |
          echo "::error::HeyMate deployment pipeline failed!"
          echo "Check the failed job logs for details."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
